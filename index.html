<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Esame VDS — Simulatore</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz VDS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-v3.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("vds_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- HEADER / INSTRUMENT BAR -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnHome" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l9-7 9 7V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="Impostazioni" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="scanline" aria-hidden="true"></div>

  <main id="main" class="main"></main>

</div>

<div class="modal-overlay" id="infoOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">Impostazioni</h3>
    <div class="setting-block">
      <div class="setting-label">Tema</div>
      <div class="theme-choice" role="radiogroup" aria-label="Tema">
        <button class="theme-opt" data-theme="base" role="radio" aria-checked="true"><span class="theme-sw sw-base"></span>Base</button>
        <button class="theme-opt" data-theme="light" role="radio" aria-checked="false"><span class="theme-sw sw-light"></span>Chiaro</button>
      </div>
    </div>
    <div class="setting-row"><span class="setting-label">Versione</span><span id="appVersion" class="setting-value"></span></div>
    <button class="btn btn-primary" id="btnCloseInfo">Chiudi</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  var hadSW = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadSW && !reloading) { reloading = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reg.update();
    });
  }).catch(function () {});
}
</script>
</body>
</html>
